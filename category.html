//sort
function handleSort(selectedValue) {
    if (!selectedValue) {
        renderProducts(allProducts);
        return;
    }

    const [sortBy, order] = selectedValue.split('-');

    // عمل نسخة مرتبة من العناصر
    const sortedProducts = [...allProducts].sort((a, b) => {
        let valA = a[sortBy] ?? '';
        let valB = b[sortBy] ?? '';

        // ترتيب النصوص (مثل Title و Brand)
        if (typeof valA === 'string') {
            return order === 'asc' 
                ? valA.localeCompare(valB) 
                : valB.localeCompare(valA);
        }

        // ترتيب الأرقام (مثل Price, Rating, Stock, Discount)
        return order === 'asc' ? valA - valB : valB - valA;
    });

      boxs.innerHTML='';
       let box = '';
      sortedProducts.forEach(element => {
       box += `     
        <div class="box">
    <img src="${element.images[0]}" alt="${element.title}">
    <div class="brand-and-rate">
       <p class="brand">${element.brand ? element.brand : 'No Data'}</p>

    </div>

    <p class="stock stock-status ${element.stock > 0 ? 'in-stock' : 'out-stock'}"> ● ${element.availabilityStatus || 'In Stock'}</p>
   
   </div>
   
      <a href="product.html?id=${element.id}" class="view-btn">View Details</a>
</div>
        
        `
               
            });

}
